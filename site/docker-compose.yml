services:
  web:
    image: nginx:1.29-alpine
    container_name: spann-site
    restart: unless-stopped
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./downloads:/usr/share/nginx/html/download:ro
    networks:
      - traefik-public
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.http.routers.spann.entrypoints=web
      - traefik.http.routers.spann.rule=Host(`spann.yared.site`)
      - traefik.http.routers.spann-secure.entrypoints=websecure
      - traefik.http.routers.spann-secure.rule=Host(`spann.yared.site`)
      - traefik.http.routers.spann-secure.tls=true
      - traefik.http.routers.spann-secure.tls.certresolver=letsencrypt
      - traefik.http.services.spann.loadbalancer.server.port=80

networks:
  traefik-public:
    external: true
